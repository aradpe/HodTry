<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בוקר טוב - אוטומציה</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4fbf1'/%3E%3Cpath d='M50 14C35 15 23 24 18 38c-2 6-1 11 2 14 3 3 8 4 14 2 14-5 23-17 24-32l-8 8c-3-1-6-1-9 0-6 2-11 6-16 13 3-8 8-14 15-18 4-2 8-3 12-3l8-8c-1 0-2 0-2 0Z' fill='%232e7d32'/%3E%3Cpath d='M24 44c5-7 10-11 16-13' fill='none' stroke='%2395d574' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4fbf1'/%3E%3Cpath d='M50 14C35 15 23 24 18 38c-2 6-1 11 2 14 3 3 8 4 14 2 14-5 23-17 24-32l-8 8c-3-1-6-1-9 0-6 2-11 6-16 13 3-8 8-14 15-18 4-2 8-3 12-3l8-8c-1 0-2 0-2 0Z' fill='%232e7d32'/%3E%3Cpath d='M24 44c5-7 10-11 16-13' fill='none' stroke='%2395d574' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            padding: 10px 16px;
            direction: rtl;
        }
        .container {
            max-width: 980px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            line-height: 1.15;
        }
        .page-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .upload-section {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 16px;
            margin-bottom: 14px;
        }
        .upload-box {
            min-width: 300px;
            background: white;
            border-radius: 14px;
            padding: 16px 20px;
            box-shadow: 0 6px 20px rgba(44, 62, 80, 0.12);
            text-align: center;
        }
        .upload-box h3 {
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 20px;
            font-weight: 800;
        }
        .text-input {
            width: 100%;
            min-height: 175px;
            margin-top: 0;
            padding: 12px 14px;
            border: 2px solid #d9e1ea;
            border-radius: 10px;
            resize: vertical;
            font: inherit;
            line-height: 1.6;
            direction: rtl;
            text-align: right;
            background: #fbfcfe;
            font-size: 16px;
        }
        .text-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }
        .generate-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .generate-btn:hover { background: #d35400; }
        .generate-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        .filters-section {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 14px;
        }
        .filter-box {
            background: white;
            border-radius: 14px;
            padding: 12px 16px;
            box-shadow: 0 6px 20px rgba(44, 62, 80, 0.12);
            border: none;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .filters-section .filter-box {
            width: 100%;
        }
        .filters-section .filter-box {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            gap: 18px;
        }
        .filter-box label {
            font-weight: bold;
            color: #2c3e50;
            font-size: 18px;
            white-space: nowrap;
        }
        .filter-box select {
            min-width: 260px;
            padding: 8px 14px;
            border: 2px solid #d9e1ea;
            border-radius: 8px;
            background: #fbfcfe;
            font: inherit;
            font-size: 16px;
            height: 42px;
        }
        .manage-order-btn {
            width: 100%;
            min-width: 0;
            padding: 8px 18px;
            border: 2px solid #007bff;
            border-radius: 8px;
            background: white;
            color: #007bff;
            font: inherit;
            font-size: 16px;
            cursor: pointer;
        }
        .manage-order-btn:hover { background: #eef4f8; }
        .drivers-primary {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 18px;
            min-width: 0;
        }
        .drivers-primary select {
            min-width: 260px;
            flex: 1 1 auto;
        }
        .drivers-order {
            min-width: 0;
        }
        .driver-order-panel {
            display: none;
            margin: 18px 0 24px;
            background: white;
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 2px solid #d6eaf8;
        }
        .driver-order-panel.open { display: block; }
        .driver-order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .driver-order-header h3 {
            margin: 0;
            font-size: 18px;
            color: #2c3e50;
        }
        .driver-order-help {
            margin: 0 0 12px;
            color: #6b7c93;
            font-size: 14px;
        }
        .driver-order-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .driver-order-actions button {
            padding: 9px 14px;
            border: 1px solid #d9e1ea;
            border-radius: 8px;
            background: #f7fafc;
            color: #2c3e50;
            font: inherit;
            cursor: pointer;
        }
        .driver-order-actions button:hover { background: #eef4f8; }
        .driver-order-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .driver-order-editor {
            width: 100%;
            min-height: 180px;
            margin-bottom: 14px;
            padding: 12px;
            border: 1px solid #d9e1ea;
            border-radius: 10px;
            background: #fbfcfe;
            font: inherit;
            line-height: 1.6;
            resize: vertical;
            direction: rtl;
            text-align: right;
        }
        .driver-order-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border: 1px solid #e5edf4;
            border-radius: 8px;
            background: #fbfcfe;
            cursor: grab;
        }
        .driver-order-item.dragging {
            opacity: 0.55;
            background: #eef6ff;
        }
        .driver-order-item.drag-over {
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.12);
        }
        .driver-order-name {
            font-weight: bold;
            color: #2c3e50;
        }
        .driver-order-handle {
            color: #7b8a9a;
            font-size: 18px;
            user-select: none;
        }
        .driver-order-empty {
            color: #6b7c93;
            font-size: 14px;
        }
        .generated-section {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: block;
        }
        .morning-action-row {
            direction: rtl;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            gap: 16px;
            flex-wrap: nowrap;
            width: 100%;
            margin-bottom: 16px;
        }
        .morning-shift-control {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 0 0 auto;
        }
        .morning-shift-control label {
            font-weight: bold;
            color: #2c3e50;
            font-size: 18px;
            white-space: nowrap;
        }
        .morning-shift-control select {
            width: 180px;
            min-width: 0;
            height: 44px;
            padding: 8px 14px;
            border: 2px solid #d9e1ea;
            border-radius: 8px;
            background: #fbfcfe;
            font: inherit;
            font-size: 16px;
        }
        .copy-btn {
            padding: 8px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .copy-btn:hover { background: #2980b9; }
        .copy-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        .copy-btn.copied { background: #27ae60; }
        .morning-generate-button {
            width: 260px;
            height: 44px;
            margin-bottom: 0;
            padding: 0 24px;
            font-size: 16px;
            border-radius: 8px;
            flex: 0 0 260px;
        }
        .morning-copy-button {
            width: 170px;
            height: 44px;
            padding: 0 24px;
            font-size: 16px;
            flex: 0 0 170px;
        }
        .morning-action-row button {
            white-space: nowrap;
        }
        @media (max-width: 760px) {
            body {
                padding: 14px;
            }
            h1 {
                font-size: 32px;
            }
            .upload-box {
                min-width: 100%;
                padding: 24px 20px;
            }
            .upload-section,
            .filters-section .filter-box {
                grid-template-columns: 1fr;
            }
            .text-input {
                min-height: 250px;
                font-size: 18px;
            }
            .filter-box {
                padding: 22px;
                gap: 16px;
            }
            .filter-box,
            .filters-section .filter-box {
                align-items: stretch;
            }
            .filter-box select,
            .filter-box button {
                width: 100%;
            }
        }
        @media (max-width: 700px) {
            .morning-action-row {
                flex-wrap: wrap;
            }
        }
        .generated-message-output {
            display: none;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            line-height: 1.8;
            font-size: 15px;
            direction: rtl;
            text-align: right;
            padding: 16px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #eee;
            width: 100%;
            margin-top: 0;
            min-height: 260px;
            resize: vertical;
        }
        .driver-name {
            font-weight: bold;
            color: #2c3e50;
        }
        .stats {
            margin-bottom: 14px;
            padding: 12px 16px;
            background: #eaf6ff;
            border-radius: 8px;
            font-size: 14px;
            color: #2c3e50;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>🌅 בוקר טוב - יוצר הודעת בוקר</h1>
        </div>

        <div class="filters-section">
            <div class="filter-box">
                <div class="drivers-primary">
                    <label for="driverFilter">נהגים</label>
                    <select id="driverFilter">
                        <option value="all">כל הנהגים</option>
                    </select>
                </div>
                <div class="drivers-order">
                    <button type="button" class="manage-order-btn" id="manageOrderBtn">⠿ סידור נהגים</button>
                </div>
            </div>
        </div>

        <div class="driver-order-panel" id="driverOrderPanel">
            <div class="driver-order-header">
                <h3>ניהול סדר נהגים</h3>
                <div class="driver-order-actions">
                    <button type="button" id="applyDriverOrderTextBtn">החל טקסט</button>
                    <button type="button" id="saveDriverOrderBtn">שמור סדר</button>
                    <button type="button" id="resetDriverOrderBtn">איפוס</button>
                </div>
            </div>
            <p class="driver-order-help">אפשר לערוך את הסדר מלמעלה למטה, שורה אחת לכל נהג, או לגרור ברשימה שמתחת.</p>
            <textarea class="driver-order-editor" id="driverOrderEditor"></textarea>
            <div class="driver-order-list" id="driverOrderList"></div>
        </div>

        <div class="upload-section">
            <div class="upload-box">
                <h3>📊 הזמנות</h3>
                <textarea class="text-input" id="excelText" placeholder="העתק לכאן את העמודות:
מספר לקוח | שם לקוח | משמרת | נהג"></textarea>
            </div>
            <div class="upload-box">
                <h3>📝 הערות</h3>
                <textarea class="text-input" id="notesText" placeholder="הדביקי כאן את הדגשים"></textarea>
            </div>
        </div>

        <div class="generated-section" id="outputSection">
            <div class="morning-action-row">
                <div class="morning-shift-control">
                    <label for="shiftFilter">סוג משמרת</label>
                    <select id="shiftFilter">
                        <option value="all">כל המשמרות</option>
                        <option value="ב">בוקר</option>
                        <option value="ל">לילה</option>
                    </select>
                </div>
                <button class="generate-btn morning-generate-button" id="generateBtn" disabled>🚀 צור הודעת בוקר</button>
                <button class="copy-btn morning-copy-button" id="copyBtn" disabled>📋 העתק</button>
            </div>

            <textarea class="generated-message-output" id="output" readonly></textarea>
            <div class="stats" id="stats"></div>
        </div>
    </div>

    <script>
        let ordersData = null;
        let notesData = null;
        let manualDriverOrder = [];
        const DRIVER_ORDER_STORAGE_KEY = 'morning-driver-order-v2';

        function normalizeShiftValue(rawShift) {
            const value = String(rawShift || '').trim();

            if (!value) return '';
            if (value === 'ב' || value.includes('בוקר')) return 'ב';
            if (value === 'ל' || value.includes('לילה') || value.includes('ערב')) return 'ל';

            return value;
        }

        function getShiftLabel(shiftValue) {
            if (shiftValue === 'ב') return 'בוקר';
            if (shiftValue === 'ל') return 'לילה';
            return 'כל המשמרות';
        }

        function getSelectedShift() {
            return document.getElementById('shiftFilter').value;
        }

        function getSelectedDriver() {
            return document.getElementById('driverFilter').value;
        }

        function loadSavedDriverOrder() {
            try {
                const saved = localStorage.getItem(DRIVER_ORDER_STORAGE_KEY);
                manualDriverOrder = saved ? JSON.parse(saved) : [];
                if (!Array.isArray(manualDriverOrder)) manualDriverOrder = [];
            } catch (error) {
                manualDriverOrder = [];
            }
        }

        function saveDriverOrder() {
            localStorage.setItem(DRIVER_ORDER_STORAGE_KEY, JSON.stringify(manualDriverOrder));
        }

        function parseDelimitedText(rawText) {
            const lines = rawText
                .split(/\r?\n/)
                .map(line => line.trim())
                .filter(Boolean);

            if (lines.length < 2) return [];

            const delimiter = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ',');
            const headers = lines[0].split(delimiter).map(header => header.trim());

            return lines.slice(1)
                .map(line => line.split(delimiter))
                .filter(cells => cells.some(cell => cell.trim()))
                .map(cells => {
                    const row = {};
                    headers.forEach((header, index) => {
                        row[header] = (cells[index] || '').trim();
                    });
                    return row;
                });
        }

        document.getElementById('excelText').addEventListener('input', function(e) {
            const value = e.target.value.trim();
            const parsedRows = value ? parseDelimitedText(value) : [];

            ordersData = parsedRows.length ? parsedRows : null;
            refreshDriverOrderState();
            updateDriverFilterOptions();

            checkReady();
        });

        document.getElementById('notesText').addEventListener('input', function(e) {
            const value = e.target.value.trim();

            notesData = value || null;

            checkReady();
        });

        function checkReady() {
            document.getElementById('generateBtn').disabled = !(ordersData && notesData);
        }

        document.getElementById('generateBtn').addEventListener('click', generate);
        document.getElementById('shiftFilter').addEventListener('change', function() {
            updateDriverFilterOptions();
            if (ordersData && notesData) generate();
        });
        document.getElementById('driverFilter').addEventListener('change', function() {
            if (ordersData && notesData) generate();
        });
        document.getElementById('manageOrderBtn').addEventListener('click', function() {
            document.getElementById('driverOrderPanel').classList.toggle('open');
            renderDriverOrderPanel();
        });
        document.getElementById('applyDriverOrderTextBtn').addEventListener('click', function() {
            applyDriverOrderFromEditor();
        });
        document.getElementById('saveDriverOrderBtn').addEventListener('click', function() {
            saveDriverOrder();
            refreshDriverOrderState();
            if (ordersData && notesData) generate();
        });
        document.getElementById('resetDriverOrderBtn').addEventListener('click', function() {
            manualDriverOrder = [];
            localStorage.removeItem(DRIVER_ORDER_STORAGE_KEY);
            refreshDriverOrderState();
            if (ordersData && notesData) generate();
        });

        function normalizeDriverName(excelDriver, options = {}) {
            const { allowFallback = false } = options;
            const rawDriver = String(excelDriver || '').trim().replace(/\s+/g, ' ');
            if (!rawDriver) return null;
            const withoutLinePrefix = rawDriver.replace(/^קו\s+/, '').trim();
            const canonicalDriver = withoutLinePrefix.replace(/\s*\/\s*/g, '/');

            const compactDriver = canonicalDriver.replace(/\s+/g, '');
            if (/^מרינה(?:[02])?$/.test(compactDriver)) {
                return 'מרינה';
            }

            // Map Excel driver names to the output display names
            const driverMap = {
                'מרינה': 'מרינה',
                'מרינה 0': 'מרינה',
                'מרינה 2': 'מרינה',
                'מרינה0': 'מרינה',
                'מרינה2': 'מרינה',
                'אברהים': 'איברהים',
                'איברהים': 'איברהים',
                'אברהים/איברהים': 'איברהים',
                'איברהים/אברהים': 'איברהים',
                'אדם עומרי': 'אדם עמרי',
                'אדם עמרי': 'אדם עמרי',
                'רביע': 'רביע',
                'עבד': 'עבד',
                'שאדי': 'שאדי',
                'מאהר': 'מאהר',
                'מוהיב': 'מוהיב',
                'אורון': 'אורון',
                'וואחיד': 'וואחיד',
                'ואחיד': 'וואחיד',
                'ווחיד': 'וואחיד',
                'אנואר': 'אנואר',
                'חוסיין': 'חוסיין',
                'לירן': 'לירן',
                'אלי': 'אלי',
            };
            return driverMap[canonicalDriver] || (allowFallback ? canonicalDriver : null);
        }

        const preferredDriverOrder = [
            'מרינה',
            'אברהים',
            'חוסיין',
            'שאדי',
            'מוהיב',
            'נגואן',
            'שאדי',
            'אנואר',
            'אדם עומרי',
            'מאהר',
            'ווחיד',
            'אלי',
            'לירן',
            'עבד',
            'רביע'
        ]
            .map(driver => normalizeDriverName(driver, { allowFallback: true }))
            .filter((driver, index, arr) => driver && arr.indexOf(driver) === index);

        loadSavedDriverOrder();

        function simplifyDriverName(driverName) {
            return String(driverName || '')
                .trim()
                .replace(/^קו\s+/, '')
                .replace(/\s*\/\s*/g, '/')
                .replace(/[\s"'`׳״_-]+/g, '')
                .toLowerCase();
        }

        function resolveDriverHeader(headerText, availableDrivers = new Set()) {
            const normalizedHeader = normalizeDriverName(headerText, { allowFallback: true });
            if (!normalizedHeader) return null;
            if (availableDrivers.has(normalizedHeader)) return normalizedHeader;

            const simplifiedHeader = simplifyDriverName(normalizedHeader);
            for (const driver of availableDrivers) {
                if (simplifyDriverName(driver) === simplifiedHeader) {
                    return driver;
                }
            }

            return null;
        }

        function normalizeCustomerNumber(value) {
            const rawValue = String(value ?? '').trim();
            if (!rawValue) return null;

            const directMatch = rawValue.match(/^(\d{3,5})(?:\.0+)?$/);
            if (directMatch) {
                return directMatch[1];
            }

            const embeddedMatch = rawValue.match(/(\d{3,5})/);
            return embeddedMatch ? embeddedMatch[1] : null;
        }

        function buildOrderedDrivers(ordersByDriver, noteDriverOrder = []) {
            const availableDrivers = Object.keys(ordersByDriver);
            const orderedDrivers = [];
            const baseOrder = manualDriverOrder.length > 0 ? manualDriverOrder : preferredDriverOrder;

            for (const driver of baseOrder) {
                if (availableDrivers.includes(driver) && !orderedDrivers.includes(driver)) {
                    orderedDrivers.push(driver);
                }
            }

            for (const driver of noteDriverOrder) {
                if (availableDrivers.includes(driver) && !orderedDrivers.includes(driver)) {
                    orderedDrivers.push(driver);
                }
            }

            for (const driver of availableDrivers) {
                if (!orderedDrivers.includes(driver)) {
                    orderedDrivers.push(driver);
                }
            }

            return orderedDrivers;
        }

        function syncManualDriverOrder(availableDrivers) {
            const sourceOrder = manualDriverOrder.length > 0 ? manualDriverOrder : preferredDriverOrder;
            const nextOrder = [];

            for (const driver of sourceOrder) {
                if (availableDrivers.includes(driver) && !nextOrder.includes(driver)) {
                    nextOrder.push(driver);
                }
            }

            for (const driver of availableDrivers) {
                if (!nextOrder.includes(driver)) {
                    nextOrder.push(driver);
                }
            }

            manualDriverOrder = nextOrder;
        }

        function buildOrdersByDriver(sourceOrders, selectedShift = 'all') {
            const relevantOrders = sourceOrders.filter(r => {
                if (!String(r['מספר לקוח'] || '').trim()) return false;
                if (selectedShift === 'all') return true;
                return normalizeShiftValue(r['משמרת']) === selectedShift;
            });

            const ordersByDriver = {};
            const customerDriverMap = {};
            for (const order of relevantOrders) {
                const driver = normalizeDriverName(order['נהג'], { allowFallback: true });
                if (!driver) continue;
                if (!ordersByDriver[driver]) ordersByDriver[driver] = [];
                const custNum = normalizeCustomerNumber(order['מספר לקוח']);
                if (!custNum) continue;
                customerDriverMap[custNum] = driver;
                if (!ordersByDriver[driver].some(o => o.custNum === custNum)) {
                    ordersByDriver[driver].push({
                        custNum,
                        custName: order['לקוח']
                    });
                }
            }

            return { relevantOrders, ordersByDriver, customerDriverMap };
        }

        function updateDriverFilterOptions() {
            const driverFilter = document.getElementById('driverFilter');
            const currentValue = driverFilter.value || 'all';
            driverFilter.innerHTML = '<option value="all">כל הנהגים</option>';

            if (!ordersData) return;

            const { ordersByDriver } = buildOrdersByDriver(ordersData, getSelectedShift());
            syncManualDriverOrder(Object.keys(ordersByDriver));
            const orderedDrivers = buildOrderedDrivers(ordersByDriver);

            for (const driver of orderedDrivers) {
                const option = document.createElement('option');
                option.value = driver;
                option.textContent = driver;
                driverFilter.appendChild(option);
            }

            driverFilter.value = orderedDrivers.includes(currentValue) ? currentValue : 'all';
        }

        function moveDriverOrderItem(fromIndex, toIndex) {
            if (fromIndex === toIndex || fromIndex < 0 || toIndex < 0) return;
            if (fromIndex >= manualDriverOrder.length || toIndex >= manualDriverOrder.length) return;

            const nextOrder = [...manualDriverOrder];
            const [movedDriver] = nextOrder.splice(fromIndex, 1);
            nextOrder.splice(toIndex, 0, movedDriver);
            manualDriverOrder = nextOrder;
            renderDriverOrderPanel();
        }

        function applyDriverOrderFromEditor() {
            const editor = document.getElementById('driverOrderEditor');
            const editedDrivers = editor.value
                .split(/\r?\n/)
                .map(line => normalizeDriverName(line, { allowFallback: true }))
                .filter(Boolean);

            const nextOrder = [];
            for (const driver of editedDrivers) {
                if (manualDriverOrder.includes(driver) && !nextOrder.includes(driver)) {
                    nextOrder.push(driver);
                }
            }

            for (const driver of manualDriverOrder) {
                if (!nextOrder.includes(driver)) {
                    nextOrder.push(driver);
                }
            }

            manualDriverOrder = nextOrder;
            renderDriverOrderPanel();
        }

        function renderDriverOrderPanel() {
            const list = document.getElementById('driverOrderList');
            const editor = document.getElementById('driverOrderEditor');
            list.innerHTML = '';
            editor.value = manualDriverOrder.join('\n');

            if (manualDriverOrder.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'driver-order-empty';
                empty.textContent = 'הדבק הזמנות כדי לנהל את סדר הנהגים.';
                list.appendChild(empty);
                return;
            }

            manualDriverOrder.forEach((driver, index) => {
                const item = document.createElement('div');
                item.className = 'driver-order-item';
                item.draggable = true;
                item.dataset.index = String(index);

                const name = document.createElement('div');
                name.className = 'driver-order-name';
                name.textContent = driver;

                const handle = document.createElement('div');
                handle.className = 'driver-order-handle';
                handle.textContent = '⋮⋮';

                item.addEventListener('dragstart', function(event) {
                    event.dataTransfer.setData('text/plain', String(index));
                    event.dataTransfer.effectAllowed = 'move';
                    item.classList.add('dragging');
                });

                item.addEventListener('dragend', function() {
                    item.classList.remove('dragging');
                    document.querySelectorAll('.driver-order-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                });

                item.addEventListener('dragover', function(event) {
                    event.preventDefault();
                    item.classList.add('drag-over');
                    event.dataTransfer.dropEffect = 'move';
                });

                item.addEventListener('dragleave', function() {
                    item.classList.remove('drag-over');
                });

                item.addEventListener('drop', function(event) {
                    event.preventDefault();
                    item.classList.remove('drag-over');
                    const fromIndex = Number(event.dataTransfer.getData('text/plain'));
                    const toIndex = index;
                    moveDriverOrderItem(fromIndex, toIndex);
                });

                item.appendChild(name);
                item.appendChild(handle);
                list.appendChild(item);
            });
        }

        function refreshDriverOrderState() {
            if (!ordersData) {
                manualDriverOrder = [];
                renderDriverOrderPanel();
                updateDriverFilterOptions();
                return;
            }

            const { ordersByDriver } = buildOrdersByDriver(ordersData, 'all');
            syncManualDriverOrder(buildOrderedDrivers(ordersByDriver));
            renderDriverOrderPanel();
            updateDriverFilterOptions();
        }

        function parseNotes(rawText, availableDrivers = new Set(), customerDriverMap = {}) {
            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l && l !== 'Sent from my iPhone');

            // Parse general notes and per-customer notes.
            // Customer matching is based only on the customer number.
            const generalNotes = [];
            const customerNotes = {}; // customerNumber -> [note texts]
            const customerNotesByDriver = {}; // driver -> customerNumber -> [note texts]
            const driverNoteLines = {}; // driver -> [{ custNum, noteText }]
            const driverOrder = [];
            let headerLine = null; // first line (title)
            let currentDriver = null;
            let pendingDriverHeader = null;

            for (const line of lines) {
                // Skip common pasted mail headers/greetings
                if (line === 'דגשים למייל בוקר' || /^בוקר טוב[,:]?$/u.test(line)) {
                    headerLine = line;
                    continue;
                }

                // Check if this line is a driver section header
                const trimmed = line.trim();
                const resolvedHeader = resolveDriverHeader(trimmed, availableDrivers);
                if (resolvedHeader) {
                    if (!driverOrder.includes(resolvedHeader)) {
                        driverOrder.push(resolvedHeader);
                    }
                    currentDriver = resolvedHeader;
                    pendingDriverHeader = null;
                    continue;
                }

                // If the user pasted a numbered list such as "1. 6171 ...",
                // "1) 6171 ..." or "1 - 6171 ...", ignore only the list
                // numbering and keep the actual customer line.
                // Plain customer lines such as "6171 ..." are left unchanged.
                const customerLine = line.replace(/^\d+\s*(?:[.)]|[-–—])\s+(?=\d{3,5}\b)/, '');

                // Try to extract customer number from line
                // Pattern: number at start, "number - name", "number name",
                // or "customer name number - note".
                const match = customerLine.match(/^(\d{3,5})\s*/);
                const matchNameThenNumber = customerLine.match(/^.+?\s(\d{3,5})\s*(?:-|[\u2013\u2014])\s*/);
                const matchMid = customerLine.match(/^.*?[-–]\s*(\d{3,5})/); // e.g. "ואחיד – 5953..."

                let custNum = null;
                let noteText = customerLine;

                if (match) {
                    custNum = normalizeCustomerNumber(match[1]);
                    noteText = customerLine; // keep the full customer line as the note
                } else if (matchNameThenNumber) {
                    custNum = normalizeCustomerNumber(matchNameThenNumber[1]);
                    noteText = customerLine;
                } else if (matchMid) {
                    // Handle cases like "לנדוור בנימינה - ואחיד – 5953ללא טעויות"
                    // Try to find customer number anywhere in the line
                    const allNums = [...customerLine.matchAll(/(\d{4,5})/g)];
                    if (allNums.length > 0) {
                        custNum = normalizeCustomerNumber(allNums[0][1]);
                        noteText = customerLine;
                    }
                }

                if (custNum) {
                    const inferredDriver = currentDriver || customerDriverMap[custNum] || null;
                    if (!currentDriver && pendingDriverHeader && inferredDriver) {
                        currentDriver = inferredDriver;
                        if (!driverOrder.includes(inferredDriver)) {
                            driverOrder.push(inferredDriver);
                        }
                    }

                    if (!customerNotes[custNum]) customerNotes[custNum] = [];
                    customerNotes[custNum].push(noteText);
                    if (inferredDriver) {
                        if (!customerNotesByDriver[inferredDriver]) customerNotesByDriver[inferredDriver] = {};
                        if (!customerNotesByDriver[inferredDriver][custNum]) customerNotesByDriver[inferredDriver][custNum] = [];
                        customerNotesByDriver[inferredDriver][custNum].push(noteText);
                        if (!driverNoteLines[inferredDriver]) driverNoteLines[inferredDriver] = [];
                        driverNoteLines[inferredDriver].push({ custNum, noteText });
                    }
                    pendingDriverHeader = null;
                } else if (line.length > 3) {
                    const looksLikeDriverHeader = !/\d/.test(trimmed) && trimmed.length <= 40 && trimmed.split(/\s+/).length <= 4;
                    if (looksLikeDriverHeader) {
                        pendingDriverHeader = trimmed;
                        currentDriver = null;
                        continue;
                    }
                    // Any note without a customer number should float to the top
                    // of the final output, regardless of where it appeared.
                    generalNotes.push(line);
                    pendingDriverHeader = null;
                }
            }

            return { generalNotes, customerNotes, customerNotesByDriver, driverNoteLines, driverOrder };
        }

        function mergeCustomerNoteTexts(notes) {
            if (!notes || notes.length === 0) return '';
            const firstNote = notes[0];
            const firstSeparator = firstNote.search(/\s[-–—]\s?/);
            const firstPrefix = firstSeparator >= 0 ? firstNote.slice(0, firstSeparator).trim() : '';
            const mergedParts = [firstNote];

            for (const note of notes.slice(1)) {
                let part = note;
                const separator = note.search(/\s[-–—]\s?/);
                if (separator >= 0 && firstPrefix && note.slice(0, separator).trim() === firstPrefix) {
                    part = note.slice(separator).replace(/^\s*[-–—]\s*/, '').trim();
                }
                mergedParts.push(part);
            }

            return mergedParts.join(' | ');
        }

        function escapeRegExp(value) {
            return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function extractCustomerNameFromNote(custNum, noteText) {
            const note = String(noteText || '').trim();
            const escapedNum = escapeRegExp(custNum);
            const nameThenNumber = note.match(new RegExp(`^(.+?)\\s+${escapedNum}\\s*(?:-|[\\u2013\\u2014])\\s*`));
            if (nameThenNumber) return nameThenNumber[1].trim();

            const numberThenName = note.match(new RegExp(`^${escapedNum}\\s*(?:-|[\\u2013\\u2014])?\\s*([^\\-\\u2013\\u2014]+?)\\s*(?:-|[\\u2013\\u2014])\\s*`));
            return numberThenName ? numberThenName[1].trim() : '';
        }

        function stripCustomerPrefixFromNote(custNum, noteText, custName = '') {
            let note = String(noteText || '').trim();
            if (!note) return '';

            const escapedNum = escapeRegExp(custNum);
            const cleanedName = String(custName || '').trim();
            if (cleanedName) {
                const originalNote = note;
                const escapedName = escapeRegExp(cleanedName);
                const nameThenNumberPattern = new RegExp(`^${escapedName}\\s+${escapedNum}\\s*(?:-|[\\u2013\\u2014])\\s*`);
                const numberThenNamePattern = new RegExp(`^${escapedNum}\\s*(?:-|[\\u2013\\u2014])?\\s*${escapedName}\\s*(?:-|[\\u2013\\u2014])?\\s*`);
                note = note
                    .replace(nameThenNumberPattern, '')
                    .replace(numberThenNamePattern, '');
                if (note === originalNote) {
                    note = note.replace(new RegExp(`^${escapedNum}\\s*(?:-|[\\u2013\\u2014])?\\s*`), '');
                }
            } else {
                note = note.replace(new RegExp(`^${escapedNum}\\s*(?:-|[\\u2013\\u2014])?\\s*`), '');
            }

            return note.replace(/^\s*[-–—]\s*/, '').trim();
        }

        function formatCustomerNoteText(custNum, noteText, custName = '') {
            const displayName = String(custName || '').trim() || extractCustomerNameFromNote(custNum, noteText);
            if (!displayName) return noteText;

            const noteBody = stripCustomerPrefixFromNote(custNum, noteText, displayName);
            return noteBody ? `${displayName} ${custNum} - ${noteBody}` : `${displayName} ${custNum}`;
        }

        function generate() {
            const selectedShift = getSelectedShift();
            const selectedDriver = getSelectedDriver();
            const { relevantOrders, ordersByDriver, customerDriverMap } = buildOrdersByDriver(ordersData, selectedShift);

            // 2. Parse notes
            const availableDrivers = new Set(Object.keys(ordersByDriver));
            const { generalNotes, customerNotes, customerNotesByDriver, driverNoteLines, driverOrder } = parseNotes(notesData, availableDrivers, customerDriverMap);
            let orderedDrivers = buildOrderedDrivers(ordersByDriver, driverOrder);
            if (selectedDriver !== 'all') {
                orderedDrivers = orderedDrivers.filter(driver => driver === selectedDriver);
            }
            const customerNameMap = {};
            for (const orders of Object.values(ordersByDriver)) {
                for (const order of orders) {
                    customerNameMap[order.custNum] = order.custName;
                }
            }

            // 3. Build output
            let output = 'בוקר טוב,\n\n';

            // Add general notes
            for (const note of generalNotes) {
                output += note + '\n';
            }
            if (generalNotes.length > 0) {
                output += '\n';
            }
            if (selectedShift !== 'all') {
                output += `משמרת: ${getShiftLabel(selectedShift)}\n`;
            }
            output += ' \n';

            let totalMatched = 0;
            let totalWithNotes = 0;

            // 4. For each driver (in order), find customers with notes
            for (const driver of orderedDrivers) {
                const driverOrders = ordersByDriver[driver];
                if (!driverOrders) continue;
                const driverCustomerSet = new Set(driverOrders.map(order => order.custNum));

                const driverLines = [];
                const groupedDriverNotes = new Map();
                const usedCustomerNums = new Set();

                for (const noteEntry of driverNoteLines[driver] || []) {
                    if (driverCustomerSet.has(noteEntry.custNum)) {
                        if (!groupedDriverNotes.has(noteEntry.custNum)) {
                            groupedDriverNotes.set(noteEntry.custNum, []);
                        }
                        groupedDriverNotes.get(noteEntry.custNum).push(formatCustomerNoteText(noteEntry.custNum, noteEntry.noteText, customerNameMap[noteEntry.custNum]));
                        usedCustomerNums.add(noteEntry.custNum);
                        totalMatched++;
                    }
                }

                for (const notes of groupedDriverNotes.values()) {
                    driverLines.push(mergeCustomerNoteTexts(notes));
                }

                for (const order of driverOrders) {
                    if (usedCustomerNums.has(order.custNum)) continue;
                    const notes = customerNotesByDriver[driver]?.[order.custNum] || customerNotes[order.custNum];
                    if (notes && notes.length > 0) {
                        driverLines.push(mergeCustomerNoteTexts(notes.map(note => formatCustomerNoteText(order.custNum, note, order.custName))));
                        totalMatched++;
                    }
                }

                if (driverLines.length > 0) {
                    output += driver + '\n\n';
                    for (const [index, line] of driverLines.entries()) {
                        output += `${index + 1}. ${line}\n\n`;
                    }
                    output += ' \n';
                    totalWithNotes++;
                }
            }

            // 5. Check for notes that reference customers NOT in today's orders (orphan notes)
            const allOrderedCustomers = new Set();
            for (const orders of Object.values(ordersByDriver)) {
                for (const o of orders) allOrderedCustomers.add(o.custNum);
            }
            const orphanNotes = [];
            for (const [custNum, notes] of Object.entries(customerNotes)) {
                if (!allOrderedCustomers.has(custNum)) {
                    orphanNotes.push({ custNum, notes });
                }
            }

            // Display
            const outputEl = document.getElementById('output');
            outputEl.value = output;
            outputEl.style.display = 'block';
            document.getElementById('outputSection').style.display = 'block';
            document.getElementById('copyBtn').disabled = false;

            // Stats
            const statsEl = document.getElementById('stats');
            let statsText = `📊 ${getShiftLabel(selectedShift)} | ${relevantOrders.length} הזמנות | ${Object.keys(customerNotes).length} הערות לקוחות | ${generalNotes.length} הערות כלליות | ${totalMatched} התאמות | ${totalWithNotes} נהגים עם דגשים`;
            if (orphanNotes.length > 0) {
                statsText += `\n⚠️ ${orphanNotes.length} הערות ללקוחות שאין להם הזמנה במשמרת שנבחרה: `;
                statsText += orphanNotes.map(o => o.custNum).join(', ');
            }
            statsEl.textContent = statsText;
            statsEl.style.display = 'block';

            document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
        }

        // Copy button
        document.getElementById('copyBtn').addEventListener('click', function() {
            if (this.disabled) return;
            const text = document.getElementById('output').value;
            navigator.clipboard.writeText(text).then(() => {
                this.textContent = '✅ הועתק!';
                this.classList.add('copied');
                setTimeout(() => {
                    this.textContent = '📋 העתק';
                    this.classList.remove('copied');
                }, 2000);
            });
        });
    </script>
</body>
</html>
